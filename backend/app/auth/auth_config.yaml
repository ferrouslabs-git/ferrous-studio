version: "3.0"

# One scope layer only. Organisations own projects directly -- there is no
# intermediate workspace/space layer, so `data:read` / `data:write` sit on the
# organisation roles.
layers:
  account:
    enabled: true
    display_name: "Organisation"

roles:
  platform:
    - name: super_admin
      display_name: "Super Admin"
      permissions:
        - platform:configure
        - accounts:manage
        - users:suspend

  account:
    - name: account_admin
      display_name: "Organisation Admin"
      permissions:
        - account:delete
        - account:read
        - members:manage
        - members:invite
        - data:read
        - data:write

    - name: account_member
      display_name: "Member"
      permissions:
        - account:read
        - data:read
        - data:write

    - name: account_viewer
      display_name: "Viewer"
      permissions:
        - account:read
        - data:read
