version: "3.0"

# One scope layer only. Organisations own projects directly -- there is no
# intermediate workspace/space layer, so `data:read` / `data:write` sit on the
# organisation roles.
layers:
  account:
    enabled: true
    display_name: "Organisation"

roles:
  # Resolved from a real platform-scope Membership (scope_id =
  # PLATFORM_SCOPE_ID) via has_platform_permission() / get_scope_context --
  # see app/auth/security/dependencies.py. users.is_platform_admin still
  # exists and is kept in sync, but only as a display flag for the existing
  # API/frontend response shape; it is not consulted for authorisation.
  platform:
    - name: platform_admin
      display_name: "Platform Admin"
      permissions:
        - platform:configure
        - accounts:manage
        - accounts:read
        - users:suspend

    - name: platform_member
      display_name: "Platform Member"
      permissions:
        - accounts:manage
        - accounts:read

    - name: platform_viewer
      display_name: "Platform Viewer"
      permissions:
        - accounts:read

  # Only the organisation admin writes content. Members and viewers read it;
  # a member's three additions are inviting people (member/viewer only -- see
  # the subset rule below), pinning tasks to a wireframe, and raising feedback
  # against a deployed environment.
  #
  # `tasks:create` is deliberately narrower than `data:write`: it authorises
  # POSTing an annotation of kind "task" and nothing else -- not notes, and
  # not editing, deleting or resolving any annotation afterwards.
  #
  # `feedback:create` is the same shape against the board: it authorises
  # POSTing one feedback report and nothing else -- not triaging it, not
  # editing it, not deleting it, not even the reporter's own. Reporting what
  # you saw in UAT is not the same act as deciding what to do about it.
  #
  # Invite authority is a subset rule (create_invitation_response in
  # api/route_helpers.py): you may only invite a role whose permissions are a
  # subset of your own. That is what stops a member inviting an admin, and it
  # is why account_admin must list every permission account_member holds --
  # drop `tasks:create` from the admin below and admins can no longer invite
  # members.
  account:
    - name: account_admin
      display_name: "Organisation Admin"
      permissions:
        - account:delete
        - account:read
        - members:manage
        - members:invite
        - data:read
        - data:write
        - tasks:create
        - board:read
        - board:write
        - board:tokens
        - feedback:create

    - name: account_member
      display_name: "Member"
      permissions:
        - account:read
        - data:read
        - members:invite
        - tasks:create
        - board:read
        - feedback:create

    - name: account_viewer
      display_name: "Viewer"
      permissions:
        - account:read
        - data:read
        - board:read
